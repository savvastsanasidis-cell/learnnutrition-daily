εις «μάθει» να ικανοποιείσαι μέσω φαγητού — και ότι αυτό αλλάζει","Τι να κάνεις τη στιγμή που νιώθεις την παρόρμηση να φας από συναίσθημα"],"source":"Πελάτης: Τζικοπούλου Μαρία | Αρχείο: Tzikopoulou 3 4 2026.mp3.md | 03/04/2026"},{"title":"Να μη «ζηλεύεις» το φαγητό των άλλων στο τραπέζι","bullets":["Πώς να κάθεσαι σε οικογενειακό τραπέζι ενώ οι άλλοι τρώνε πιο ελεύθερα","Η διαφορά ανάμεσα στο «το θέλω» και στο «μπορώ να το αφήσω χωρίς ένταση»","Γιατί το ισχυρό κίνητρο («θέλω να ξαναβρώ τον εαυτό μου») κάνει τη διαφορά"],"source":"Πελάτης: Θεοχαροπούλου Θεοδώρα | Αρχείο: Theoharopoulou 10 6 2026.mp3.md | 10/06/2026"}],"dyskolies":[{"title":"Μαγειρεύω ένα φαγητό για όλους — πώς κρατάω τη δική μου μερίδα","bullets":["Τεχνικές για να τρως το οικογενειακό φαγητό ελέγχοντας ποσότητα και λάδι","Πώς να σερβίρεις πρώτα τη δική σου μερίδα πριν προστεθούν έξτρα","Ψυχολογική διαχείριση όταν όλοι τρώνε πιο ελεύθερα"],"source":"Πελάτης: Κελεσίδου Αναστασία | Αρχείο: Kelesidou 11 6 2026.mp3.md | 11/06/2026"},{"title":"Μυρωδιές & delivery στο σπίτι: η πιο δύσκολη στιγμή","bullets":["Γιατί η μυρωδιά του φαγητού των άλλων είναι μεγαλύτερος πειρασμός από την εικόνα","Πρακτικές για όταν η οικογένεια παραγγέλνει ή μαγειρεύει κάτι που αγαπάς","Πώς να μη μετατρέπεται μια μυρωδιά σε ανεξέλεγκτη λιγούρα"],"source":"Πελάτης: Θεοχαροπούλου Θεοδώρα | Αρχείο: Theoharopoulou 10 6 2026.mp3.md | 10/06/2026"},{"title":"«Δεν μου έρχεται να πιω νερό» — πώς το λύνεις","bullets":["Μικρά βήματα για να αυξήσεις σταδιακά τα υγρά μέσα στη μέρα","Εναλλακτικές με γεύση (λεμόνι, ανθρακούχο) χωρίς ζάχαρη","Γιατί η ενυδάτωση βοηθά άμεσα στη δυσκοιλιότητα"],"source":"Πελάτης: Ανδρέας Βλαζάκη | Αρχείο: 10 6 2026.mp3.md | 10/06/2026"},{"title":"Φαγητό στη δουλειά χωρίς χρόνο: εύκολες & σωστές λύσεις","bullets":["Γιατί ένα έτοιμο σάντουιτς ολικής με γαλοπούλα/τυρί είναι αξιοπρεπής λύση","Πώς να το αναβαθμίσεις με λαχανικά (ντομάτα, μαρούλι) χωρίς κόπο","Τι να προσέχεις στη μερίδα όταν τρως «με το μάτι» στη δουλειά :["Ποια είναι μια λογική μερίδα για ένα βαρύ καλοκαιρινό πιάτο (≈200-250 γρ.)","Γιατί δεν χρειάζεται light εκδοχή — αρκεί η σωστή ποσότητα","Πώς να εντάξεις ένα αγαπημένο φαγητό χωρίς να βγεις εκτός προγράμματος"],"source":"Πελάτης: Πουσατιδου Κατερίνα | Αρχείο: Pousatidou 10 6 2026.mp3.md | 10/06/2026"},{"title":"«Γιατί πρέπει να βάζω λάδι αφού κάνω δίαιτα;»","bullets":["Ο ρόλος του ελαιολάδου ως απαραίτητου λιπαρού, όχι «εχθρού»","Γιατί η ελεγχόμενη ποσότητα είναι το κλειδί, όχι η αποφυγή","Πώς να το δοσολογείς όταν μαγειρεύεις για πολλά άτομα"],"source":"Πελάτης: Κελεσίδου Αναστασία | Αρχείο: Kelesidou 11 6 2026.mp3.md | 11/06/2026"},{"title":"«Γιατί δεν χάνω βάρος ενώ κάνω την ένεση;»","bullets":["Γιατί το φάρμακο δεν δουλεύει χωρίς αλλαγές στη διατροφή","Ο ρόλος της χαμηλής όρεξης — και γιατί πρέπει να ενημερώσεις τον γιατρό","Ρεαλιστικός ρυθμός: ~1 κιλό/μήνα δεν είναι αποτυχία"],"source":"Πελάτης: Πουσατιδου Κατερίνα | Αρχείο: Pousatidou 28 4 2026.mp3.md | 28/04/2026"},{"title":"«Ποιο φυτικό γάλα δεν με φουσκώνει;»","bullets":["Σύγκριση ροφημάτων αμυγδάλου (βιολογικό vs συμβατικό, ποσοστό, πρόσθετα)","Γιατί τα ίδια τα αμύγδαλα μπορεί να μη σε ενοχλούν ενώ το ρόφημα ναι","Τι να δοκιμάσεις σταδιακά για να βρεις τι σου ταιριάζει"],"source":"Πελάτης: Βλαζάκη Μαρία | Αρχείο: Vlazaki 10 6 2026.mp3.md | 10/06/2026"}],"sintages":[{"title":"Σάντουιτς ολικής με γαλοπούλα, cottage & gouda — το πρωινό της δουλειάς","bullets":["Γιατί ο συνδυασμός ψωμί ολικής + πρωτεΐνη σε κρατά χορτάτο μέχρι το μεσημέρι","Πώς να το κάνεις πιο ολοκληρωμένο με ντομάτα/μαρούλι","Έτοιμο σε 3 λεπτά — ιδανικό για βιαστικά πρωινά"],"source":"Πελάτης: Τσιναφορνιότης Δημήτρης | Αρχείο: Tsinaforniotis 11 6 2026.mp3.md | 11/06/2026"},{"title":"Δύο γρήγορα πρωινά: αυγά με κασέρι ή παξιμάδι με βραστό αυγό","bullets":["Δύο εναλλακτικές πλούσιες σε πρωτεΐνη για σταθερό πρωινό","Γιατί το βραστό αυγό + παξιμάδι ολικής είναι ισορροπημένη επιλογή","Πώς να τα κρατήσεις απλά χωρίς πολύ λάδι"],"source":"Πελάτης: Κελεσίδου Αναστασία | Αρχείο: Kelesidou 11 6 2026.mp3.md | 11/06/2026"},{"title":"Πιο ελαφρύ καλοκαιρινό παστίτσιο: μερίδα & κόλπα","bullets":["Πώς να απολαύσεις ένα κλασικό βαρύ πιάτο μέσα στο καλοκαίρι","Σωστή μερίδα και τι να προσέξεις στην μπεσαμέλ","Γιατί δεν χρειάζεσαι «light» εκδοχή — αρκεί η ποσότητα"],"source":"Πελάτης: Πουσατιδου Κατερίνα | Αρχείο: Pousatidou 10 6 2026.mp3.md | 10/06/2026"},{"title":"Πράσινα λαχανικά μετά από εγχείρηση: φασολάκια & σούπες που χορταίνουν","bullets":["Γιατί τα μαλακά, καλοβρασμένα λαχανικά βοηθούν στην ανάρρωση και το έντερο","Πώς να περάσεις από τις σούπες σε πιο στερεά γεύματα σταδιακά","Ο ρόλος των φυτικών ινών + νερού στη δυσκοιλιότητα"],"source":"Πελάτης: Ανδρέας Βλαζάκη | Αρχείο: 10 6 2026.mp3.md | 10/06/2026"},{"title":"Φρούτο ως απογευματινό/ενδιάμεσο σνακ που σβήνει τη λιγούρα","bullets":["Γιατί ένα φρούτο εποχής στις 12:00 ή το απόγευμα κόβει το τσιμπολόγημα","Συνδυασμός με λίγους ξηρούς καρπούς για περισσότερο κορεσμό","Πώς το «το έχω διαθέσιμο» μειώνει την ψυχολογική πίεση"],"source":"Πελάτης: Ψωμιάδου Μαρία | Αρχείο: Psomiadou 11 6 2026.mp3.md | 11/06/2026"}]}};

const CATS = [
  { key: 'all',          label: '📋 Όλες',                  css: '' },
  { key: 'enimerotika',  label: '📰 Ενημερωτικά',           css: 'cat-enimerotika' },
  { key: 'psixologia',   label: '🧠 Ψυχολογία',             css: 'cat-psixologia' },
  { key: 'dyskolies',    label: '⚡ Δυσκολίες',             css: 'cat-dyskolies' },
  { key: 'simperifora',  label: '🔄 Συμπεριφορά',           css: 'cat-simperifora' },
  { key: 'erotiseis',    label: '❓ Ερωτήσεις',             css: 'cat-erotiseis' },
  { key: 'sintages',     label: '🍽️ Συνταγές / Γεύματα',   css: 'cat-sintages' },
];

function renderTabs(activeKey) {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  CATS.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (c.key === activeKey ? ' active' : '');
    btn.dataset.cat = c.key;
    const ideas = c.key === 'all'
      ? Object.values(DATA.ideas || {}).flat()
      : (DATA.ideas || {})[c.key] || [];
    btn.textContent = c.label + (ideas.length ? ` (${ideas.length})` : '');
    btn.onclick = () => renderTabs(c.key);
    tabsEl.appendChild(btn);
  });
  renderContent(activeKey);
}

function renderContent(activeKey) {
  const el = document.getElementById('content');
  el.innerHTML = '';

  const catsToShow = activeKey === 'all'
    ? CATS.filter(c => c.key !== 'all')
    : CATS.filter(c => c.key === activeKey);

  let anyContent = false;
  catsToShow.forEach(cat => {
    const ideas = (DATA.ideas || {})[cat.key] || [];
    if (!ideas.length) return;
    anyContent = true;
    const section = document.createElement('div');
    section.className = 'cat-section visible ' + cat.css;
    const hdr = document.createElement('div');
    hdr.className = 'cat-header';
    hdr.textContent = cat.label;
    section.appendChild(hdr);
    const grid = document.createElement('div');
    grid.className = 'cards-grid';
    ideas.forEach(idea => {
      const card = document.createElement('div'); card.className = 'card';
      const t = document.createElement('div'); t.className = 'card-title'; t.textContent = idea.title; card.appendChild(t);
      const ul = document.createElement('ul'); ul.className = 'card-bullets';
      (idea.bullets || []).forEach(b => { const li = document.createElement('li'); li.textContent = b; ul.appendChild(li); });
      card.appendChild(ul);
      if (idea.source) { const s = document.createElement('div'); s.className = 'card-source'; s.textContent = '→ ' + idea.source; card.appendChild(s); }
      grid.appendChild(card);
    });
    section.appendChild(grid);
    el.appendChild(section);
  });

  if (!anyContent) {
    el.innerHTML = '<div class="empty"><h3>Δεν υπάρχουν ιδέες ακόμα</h3><p>Το σύστημα ανανεώνεται αυτόματα κάθε 2 μέρες στις 8:30 πμ.<br>Ιδέες εμφανίζονται μόνο αν υπήρξαν συνεδρίες ή ενημερώσεις στο τελευταίο 48ωρο.</p></div>';
  }
}

// Init
document.getElementById('meta').innerHTML = 'Τελευταία ενημέρωση: <strong>' + DATA.lastUpdate + '</strong>';
if (DATA.sessionCount > 0) {
  const b = document.getElementById('banner');
  b.style.display = 'block';
  b.textContent = DATA.totalFileCount + ' αρχεία αναλύθηκαν (' + DATA.sessionDates + ')';
}
if ((DATA.analyzedFiles || []).length) {
  const panel = document.getElementById('sourcesPanel');
  const list = document.getElementById('sourcesList');
  panel.style.display = 'block';
  list.innerHTML = DATA.analyzedFiles.map(f => '📄 ' + f.client + ' — ' + f.kind + ' — ' + f.file).join('<br>');
}
renderTabs('all');
</script>
