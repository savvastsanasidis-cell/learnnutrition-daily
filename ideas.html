<script>
const DATA = {"lastUpdate":"02/07/2026 00:00","sessionCount":4,"dietCount":0,"totalFileCount":4,"sessionDates":"30/06/2026, 01/07/2026","generationMode":"auto","analyzedFiles":[{"client":"Τζικοπούλου Μαρία","kind":"transcript","file":"Τζικοπουλου Μαρια 1 7 2026, 9_20_44 πμ 1.mp3.md"},{"client":"Τζικοπούλου Μαρία","kind":"transcript","file":"Τζικοπουλου Μαρια 1 7 2026, 9_20_44 πμ.mp3.md"},{"client":"Λαμπρινάκη Μελίνα","kind":"transcript","file":"Λαμπρινακη Μελινα 1 7 2026, 8_40_03.mp3.md"},{"client":"Dimopoulou Konstantia","kind":"transcript","file":"Δημοπουλου Κωνσταντια 30 6 2026, 5_41_31 μμ.mp3.md"}],"ideas":{"enimerotika":[{"title":"Απότομη διακοπή Mounjaro: γιατί επιστρέφει η όρεξη με ένταση","bullets":["Ο γιατρός προειδοποιεί ότι το απότομο σταμάτημα «ξεκλειδώνει» μηχανισμούς πείνας που το φάρμακο κρατούσε κάτω","Σταδιακή μείωση δόσης αντί για απότομη διακοπή — γιατί το σώμα ανταποκρίνεται διαφορετικά","Πόσο διαρκεί συνήθως η φάση αυξημένης όρεξης μετά τη διακοπή"],"source":"Πελάτης: Τζικοπούλου Μαρία | Αρχείο: Τζικοπουλου Μαρια 1 7 2026, 9_20_44 πμ.mp3.md | 01/07/2026"},{"title":"Θυρεοειδής και κατακράτηση υγρών: τι δείχνουν οι έρευνες","bullets":["Η σύνδεση υποθυρεοειδισμού με έντονες κατακρατήσεις, όχι μόνο με αλλαγές στο λίπος","Πώς το φούσκωμα/πρήξιμο μπορεί να σχετίζεται με μη ρυθμισμένο θυρεοειδή","Τι εξετάσεις αξίζει να ζητήσει κανείς όταν το πρήξιμο επιμένει"],"source":"Πελάτης: Λαμπρινάκη Μελίνα | Αρχείο: Λαμπρινακη Μελινα 1 7 2026, 8_40_03.mp3.md | 01/07/2026"}],"psixologia":[{"title":"Ο φόβος της υποτροπής μετά τη διακοπή φαρμάκου απώλειας βάρους","bullets":["«Φοβάμαι λίγο μήπως ξαναγίνει» — το άγχος πριν το διάλειμμα/τη συντήρηση","Πώς η ανασφάλεια για το μέλλον επηρεάζει τη σχέση με το φαγητό στο παρόν","Στρατηγικές για να μπεις σε φάση συντήρησης χωρίς άγχος"],"source":"Πελάτης: Τζικοπούλου Μαρία | Αρχείο: Τζικοπουλου Μαρια 1 7 2026, 9_20_44 πμ.mp3.md | 01/07/2026"},{"title":"Πότε το φαγητό γίνεται διέξοδος: ο ρόλος του περιβάλλοντος","bullets":["Η ίδια η πελάτισσα συνδέει μια δύσκολη περίοδο με το περιβάλλον/σπίτι όπου ζούσε τότε","Πώς μια αλλαγή χώρου/ρουτίνας μπορεί να βελτιώσει αυτόματα τη σχέση με το φαγητό","Γιατί «μία φορά στο τόσο» δεν σημαίνει επιστροφή στην παλιά συμπεριφορά"],"source":"Πελάτης: Τζικοπούλου Μαρία | Αρχείο: Τζικοπουλου Μαρια 1 7 2026, 9_20_44 πμ.mp3.md | 01/07/2026"}],"dyskolies":[{"title":"«Δεν με τραβάει το νερό» — όταν η ενυδάτωση είναι ο πιο δύσκολος στόχος","bullets":["Η πελάτισσα ομολογεί ότι πρέπει να «διευθύνει» συνειδητά τον εαυτό της για να πιει νερό","Πρακτική λύση: ένα ποτήρι νερό πριν από κάθε γεύμα, ειδικά πριν το απόγευμα","Πώς το νερό μειώνει τις λιγούρες και βοηθά στον έλεγχο της όρεξης"],"source":"Πελάτης: Dimopoulou Konstantia | Αρχείο: Δημοπουλου Κωνσταντια 30 6 2026, 5_41_31 μμ.mp3.md | 30/06/2026"},{"title":"Πρωινό μόνο Σαββατοκύριακο: πότε είναι ρεαλιστικό να το παραλείπεις","bullets":["«Τα άλλα πρωινά τίποτα, μου φεύγει η μέρα» — η καθημερινή βιασύνη ως εμπόδιο","Πώς οργανώνεται η μέρα ώστε το πρωινό να μη λείπει εντελώς","Τι σημαίνει αν κάποιος νιώθει καλά χωρίς πρωινό καθημερινά"],"source":"Πελάτης: Λαμπρινάκη Μελίνα | Αρχείο: Λαμπρινακη Μελινα 1 7 2026, 8_40_03.mp3.md | 01/07/2026"}],"simperifora":[{"title":"Το σήμα κορεσμού: γιατί τρώμε γρήγορα και δεν προλαβαίνουμε να το νιώσουμε","bullets":["«Δεν περιμένω να φτάσει το σήμα που σταματώ» — η πελάτισσα αναγνωρίζει ότι τρώει πολύ γρήγορα","Το μισάωρο που χρειάζεται ο εγκέφαλος για να καταγράψει τον κορεσμό","Πώς οι επιλογές που χορταίνουν περισσότερο (κοτόπουλο, αυγά, γιαούρτι) βοηθούν το βράδυ"],"source":"Πελάτης: Dimopoulou Konstantia | Αρχείο: Δημοπουλου Κωνσταντια 30 6 2026, 5_41_31 μμ.mp3.md | 30/06/2026"},{"title":"Ζύγισμα με ρούχα, βιαστικά, χωρίς προετοιμασία: πόσο επηρεάζει το νούμερο","bullets":["Η πελάτισσα ζυγίστηκε πρόχειρα με διαφορετικά ρούχα και είδε 400γρ. διαφορά","Γιατί το ζύγισμα χρειάζεται σταθερές συνθήκες (ίδια ώρα, ρούχα, πριν το φαγητό) για να είναι συγκρίσιμο","Πόσο «θόρυβο» προσθέτουν τέτοιες μικροδιαφορές στην ερμηνεία της προόδου"],"source":"Πελάτης: Λαμπρινάκη Μελίνα | Αρχείο: Λαμπρινακη Μελινα 1 7 2026, 8_40_03.mp3.md | 01/07/2026"}],"erotiseis":[{"title":"«Πόσα κιλά είναι φυσιολογικό να πάρεις κάνοντας διάλειμμα (συντήρηση) από τη δίαιτα;»","bullets":["Η διαφορά ανάμεσα σε θερμίδες συντήρησης και θερμίδες απώλειας βάρους","Γιατί λίγα κιλά στην αρχή της συντήρησης είναι συνήθως υγρά, όχι λίπος","Πώς βρίσκεις τις δικές σου θερμίδες συντήρησης χωρίς να τις ξεπερνάς"],"source":"Πελάτης: Τζικοπούλου Μαρία | Αρχείο: Τζικοπουλου Μαρια 1 7 2026, 9_20_44 πμ.mp3.md | 01/07/2026"},{"title":"«Το φάρμακο επηρεάζει μόνο το σώμα ή και το μυαλό/τις λιγούρες;»","bullets":["Πώς η καθυστέρηση στην κένωση του στομάχου συνδέεται με λιγότερες λιγούρες","Γιατί όταν δεν πεινάς, τα ερεθίσματα για γλυκό/αλμυρό μειώνονται φυσικά","Τι μένει «καθαρά ψυχολογικό» και δεν επηρεάζεται από το φάρμακο"],"source":"Πελάτης: Τζικοπούλου Μαρία | Αρχείο: Τζικοπουλου Μαρια 1 7 2026, 9_20_44 πμ.mp3.md | 01/07/2026"}],"sintages":[{"title":"Σαλάτα σίζαρ με κοτόπουλο ως ελαφρύ βραδινό έξω","bullets":["Επιλογή σαλάτας τύπου σίζαρ με κοτόπουλο, λίγη παρμεζάνα, χωρίς κρουτόν","Πώς να την παραγγείλεις έξω κρατώντας τη «καθαρή» (χωρίς έξτρα σος/λιπαρά)","Ιδανική για βραδινό όταν θέλεις κάτι ελαφρύ αλλά χορταστικό"],"source":"Πελάτης: Λαμπρινάκη Μελίνα | Αρχείο: Λαμπρινακη Μελινα 1 7 2026, 8_40_03.mp3.md | 01/07/2026"},{"title":"Ελαφρύ βραδινό που χορταίνει: κοτόπουλο, αυγά, γιαούρτι","bullets":["Οι επιλογές που η ίδια η πελάτισσα αναγνωρίζει ότι την κρατούν πιο χορτάτη το βράδυ","Πώς ένα συμπλήρωμα γιαουρτιού μπορεί να ολοκληρώσει το βραδινό γεύμα","Γιατί η πρωτεΐνη το βράδυ βοηθά στον έλεγχο της πρωινής όρεξης"],"source":"Πελάτης: Dimopoulou Konstantia | Αρχείο: Δημοπουλου Κωνσταντια 30 6 2026, 5_41_31 μμ.mp3.md | 30/06/2026"}]}};

const CATS = [
  { key: 'all',          label: '📋 Όλες',                  css: '' },
  { key: 'enimerotika',  label: '📰 Ενημερωτικά',           css: 'cat-enimerotika' },
  { key: 'psixologia',   label: '🧠 Ψυχολογία',             css: 'cat-psixologia' },
  { key: 'dyskolies',    label: '⚡ Δυσκολίες',             css: 'cat-dyskolies' },
  { key: 'simperifora',  label: '🔄 Συμπεριφορά',           css: 'cat-simperifora' },
  { key: 'erotiseis',    label: '❓ Ερωτήσεις',             css: 'cat-erotiseis' },
  { key: 'sintages',     label: '🍽️ Συνταγές / Γεύματα',   css: 'cat-sintages' },
];

function renderTabs(activeKey) {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  CATS.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (c.key === activeKey ? ' active' : '');
    btn.dataset.cat = c.key;
    const ideas = c.key === 'all'
      ? Object.values(DATA.ideas || {}).flat()
      : (DATA.ideas || {})[c.key] || [];
    btn.textContent = c.label + (ideas.length ? ` (${ideas.length})` : '');
    btn.onclick = () => renderTabs(c.key);
    tabsEl.appendChild(btn);
  });
  renderContent(activeKey);
}

function renderContent(activeKey) {
  const el = document.getElementById('content');
  el.innerHTML = '';

  const catsToShow = activeKey === 'all'
    ? CATS.filter(c => c.key !== 'all')
    : CATS.filter(c => c.key === activeKey);

  let anyContent = false;
  catsToShow.forEach(cat => {
    const ideas = (DATA.ideas || {})[cat.key] || [];
    if (!ideas.length) return;
    anyContent = true;
    const section = document.createElement('div');
    section.className = 'cat-section visible ' + cat.css;
    const hdr = document.createElement('div');
    hdr.className = 'cat-header';
    hdr.textContent = cat.label;
    section.appendChild(hdr);
    const grid = document.createElement('div');
    grid.className = 'cards-grid';
    ideas.forEach(idea => {
      const card = document.createElement('div'); card.className = 'card';
      const t = document.createElement('div'); t.className = 'card-title'; t.textContent = idea.title; card.appendChild(t);
      const ul = document.createElement('ul'); ul.className = 'card-bullets';
      (idea.bullets || []).forEach(b => { const li = document.createElement('li'); li.textContent = b; ul.appendChild(li); });
      card.appendChild(ul);
      if (idea.source) { const s = document.createElement('div'); s.className = 'card-source'; s.textContent = '→ ' + idea.source; card.appendChild(s); }
      grid.appendChild(card);
    });
    section.appendChild(grid);
    el.appendChild(section);
  });

  if (!anyContent) {
    el.innerHTML = '<div class="empty"><h3>Δεν υπάρχουν ιδέες ακόμα</h3><p>Το σύστημα ανανεώνεται αυτόματα κάθε 2 μέρες στις 8:30 πμ.<br>Ιδέες εμφανίζονται μόνο αν υπήρξαν συνεδρίες ή ενημερώσεις στο τελευταίο 48ωρο.</p></div>';
  }
}

// Init
document.getElementById('meta').innerHTML = 'Τελευταία ενημέρωση: <strong>' + DATA.lastUpdate + '</strong>';
if (DATA.sessionCount > 0) {
  const b = document.getElementById('banner');
  b.style.display = 'block';
  b.textContent = DATA.totalFileCount + ' αρχεία αναλύθηκαν (' + DATA.sessionDates + ')';
}
if ((DATA.analyzedFiles || []).length) {
  const panel = document.getElementById('sourcesPanel');
  const list = document.getElementById('sourcesList');
  panel.style.display = 'block';
  list.innerHTML = DATA.analyzedFiles.map(f => '📄 ' + f.client + ' — ' + f.kind + ' — ' + f.file).join('<br>');
}
renderTabs('all');
</script>
